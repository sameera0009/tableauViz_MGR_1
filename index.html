<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Manager Performance</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;background:#f0f0ec;
  font-family:'Inter',-apple-system,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}

/* ══════════════════════════════
   SPLASH
══════════════════════════════ */
#splash{
  position:fixed;inset:0;background:#f0f0ec;z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:opacity .5s ease;
}
.sp-logo{
  width:56px;height:56px;border-radius:16px;
  background:#fff;border:0.5px solid #e2e8f0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 14px rgba(0,0,0,0.08);margin-bottom:6px;
}
.sp-name{font-size:14px;font-weight:700;color:#0f172a;letter-spacing:-.01em;}
.sp-by{font-size:10px;font-weight:500;color:#94a3b8;letter-spacing:.05em;}
.sp-track{width:90px;height:2px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:14px;}
.sp-fill{height:100%;width:0;background:linear-gradient(90deg,#16a34a,#0d9488);border-radius:99px;animation:spload 1.8s ease forwards;}
@keyframes spload{to{width:100%}}

/* ══════════════════════════════
   MAIN
══════════════════════════════ */
#main{
  display:none;width:100%;height:100%;
  position:relative;
  align-items:center;justify-content:center;
  padding:10px 8px;
}

/* grid: [card][card][photo][card][card] */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr auto 1fr 1fr;
  align-items:center;
  gap:10px;
  width:100%;
  position:relative;z-index:2;
}

/* SVG connector overlay */
#svg-layer{
  position:absolute;inset:0;
  pointer-events:none;overflow:visible;z-index:1;
}

/* ── PHOTO COLUMN ── */
.photo-col{
  display:flex;flex-direction:column;
  align-items:center;gap:6px;
  position:relative;flex-shrink:0;
}
/* conic ring — 4 quadrants, green=achieved red=missed */
.av-outer{
  border-radius:50%;padding:3.5px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 24px rgba(0,0,0,0.14);
  transition:background .4s ease;
}
.av-inner{
  border-radius:50%;
  border:3px solid #fff;
  overflow:hidden;background:#e8f5e9;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
#av-img{width:100%;height:100%;object-fit:cover;display:block;}
#av-ini{
  width:100%;height:100%;
  display:none;align-items:center;justify-content:center;
  font-weight:700;color:#15803d;
  position:absolute;inset:0;
}
#mgr-name{
  font-size:12px;font-weight:700;color:#0f172a;
  text-align:center;white-space:nowrap;letter-spacing:-.01em;
}

/* ── GLASS KPI CARD ── */
.gc{
  background:rgba(255,255,255,0.58);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:0.5px solid rgba(255,255,255,0.75);
  border-radius:14px;padding:11px 12px 9px;
  box-shadow:0 2px 14px rgba(15,23,42,0.07),inset 0 1px 0 rgba(255,255,255,0.9);
  position:relative;overflow:hidden;
  cursor:pointer;transition:transform .15s,box-shadow .15s;
  min-width:0;
}
.gc:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(15,23,42,0.12);}
/* top stripe */
.gc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0;}
.gc.ok::before{background:#16a34a;}
.gc.miss::before{background:#dc2626;}
/* sheen */
.gc::after{content:'';position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,0.2) 0%,transparent 55%);border-radius:14px;pointer-events:none;}

.gc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.gc-icon{width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.gc.ok .gc-icon{background:#dcfce7;}
.gc.miss .gc-icon{background:#fee2e2;}
.gc-lbl{font-size:7.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#94a3b8;}
.gc-val{font-size:17px;font-weight:700;color:#0f172a;letter-spacing:-.02em;line-height:1;margin-bottom:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gc-delta{font-size:9px;font-weight:700;margin-bottom:1px;display:flex;align-items:center;gap:2px;}
.gc-delta.up{color:#15803d;}.gc-delta.dn{color:#b91c1c;}.gc-delta.neu{color:#94a3b8;}
.gc-vs{font-size:7.5px;color:#94a3b8;margin-bottom:7px;}
.gc-bar{height:3px;background:rgba(0,0,0,0.07);border-radius:99px;overflow:hidden;margin-bottom:3px;}
.gc-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.22,.68,0,1);}
.gc.ok .gc-fill{background:#16a34a;}
.gc.miss .gc-fill{background:#dc2626;}
.gc-att{font-size:7.5px;font-weight:600;}
.gc.ok .gc-att{color:#15803d;}.gc.miss .gc-att{color:#b91c1c;}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect x="2" y="2" width="24" height="24" rx="7" stroke="#16a34a" stroke-width="1.8"/>
      <polyline points="5,19 9,13 13,16 20,8" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="8" r="2" fill="#16a34a"/>
    </svg>
  </div>
  <div class="sp-name">Manager Performance</div>
  <div class="sp-by">Viz Extension · By Sameera</div>
  <div class="sp-track"><div class="sp-fill"></div></div>
</div>

<!-- MAIN -->
<div id="main">
  <svg id="svg-layer" aria-hidden="true"></svg>

  <div class="grid" id="grid">

    <!-- Card 0: left side card 1 (Profit) -->
    <div class="gc ok" id="gc0" data-idx="0">
      <div class="gc-top">
        <div class="gc-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><polyline points="1,11 4,6.5 7,8.5 13,2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="gc-lbl" id="gc0-lbl">Profit</span>
      </div>
      <div class="gc-val" id="gc0-val">—</div>
      <div class="gc-delta neu" id="gc0-delta">—</div>
      <div class="gc-vs" id="gc0-vs"></div>
      <div class="gc-bar"><div class="gc-fill" id="gc0-bar" style="width:0%"></div></div>
      <div class="gc-att" id="gc0-att"></div>
    </div>

    <!-- Card 1: left side card 2 (Advances) -->
    <div class="gc ok" id="gc1" data-idx="1">
      <div class="gc-top">
        <div class="gc-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 7h5M9.5 7L7.5 5M9.5 7L7.5 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="gc-lbl" id="gc1-lbl">Advances</span>
      </div>
      <div class="gc-val" id="gc1-val">—</div>
      <div class="gc-delta neu" id="gc1-delta">—</div>
      <div class="gc-vs" id="gc1-vs"></div>
      <div class="gc-bar"><div class="gc-fill" id="gc1-bar" style="width:0%"></div></div>
      <div class="gc-att" id="gc1-att"></div>
    </div>

    <!-- PHOTO CENTRE -->
    <div class="photo-col" id="photo-col">
      <div class="av-outer" id="av-outer" style="background:conic-gradient(#16a34a 0% 25%,#16a34a 25% 50%,#16a34a 50% 75%,#16a34a 75% 100%)">
        <div class="av-inner" id="av-inner">
          <img id="av-img" src="" alt="Manager photo"/>
          <div id="av-ini"></div>
        </div>
      </div>
      <div id="mgr-name">—</div>
    </div>

    <!-- Card 2: right side card 1 (Deposits) -->
    <div class="gc ok" id="gc2" data-idx="2">
      <div class="gc-top">
        <div class="gc-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="5" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 5V3.5a2 2 0 0 1 4 0V5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </div>
        <span class="gc-lbl" id="gc2-lbl">Deposits</span>
      </div>
      <div class="gc-val" id="gc2-val">—</div>
      <div class="gc-delta neu" id="gc2-delta">—</div>
      <div class="gc-vs" id="gc2-vs"></div>
      <div class="gc-bar"><div class="gc-fill" id="gc2-bar" style="width:0%"></div></div>
      <div class="gc-att" id="gc2-att"></div>
    </div>

    <!-- Card 3: right side card 2 (NPA %) -->
    <div class="gc ok" id="gc3" data-idx="3">
      <div class="gc-top">
        <div class="gc-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4"/><text x="7" y="10.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" font-family="Inter,sans-serif">%</text></svg>
        </div>
        <span class="gc-lbl" id="gc3-lbl">NPA %</span>
      </div>
      <div class="gc-val" id="gc3-val">—</div>
      <div class="gc-delta neu" id="gc3-delta">—</div>
      <div class="gc-vs" id="gc3-vs"></div>
      <div class="gc-bar"><div class="gc-fill" id="gc3-bar" style="width:0%"></div></div>
      <div class="gc-att" id="gc3-att"></div>
    </div>

  </div>
</div>

<script>
'use strict';
(function(){

var $=function(id){return document.getElementById(id);};
var appEl=document.getElementById('main');

/* ── number format — no currency, smart units ── */
function fmtN(n){
  if(n===null||isNaN(n)) return '—';
  var abs=Math.abs(n),s=n<0?'-':'';
  if(abs>=1e9) return s+(abs/1e9).toFixed(2)+' B';
  if(abs>=1e6) return s+(abs/1e6).toFixed(2)+' M';
  if(abs>=1e3) return s+(abs/1e3).toFixed(2)+' K';
  if(abs>=1)   return s+abs.toFixed(2);
  return s+(abs*100).toFixed(2)+'%'; /* sub-1 treated as percentage */
}

/* ── category → card index mapping ── */
var CMAP={
  'first card':0,'1st':0,'card1':0,'card 1':0,'profit':0,
  'second card':1,'2nd':1,'card2':1,'card 2':1,'advances':1,'advance':1,
  'third card':2,'3rd':2,'card3':2,'card 3':2,'deposits':2,'deposit':2,
  'fourth card':3,'4th':3,'card4':3,'card 4':3,'npa':3,'npa %':3,'npa%':3
};
var LABELS=['Profit','Advances','Deposits','NPA %'];
var INVERT=[false,false,false,true]; /* NPA: lower is better */

/* ── update conic gradient ring based on achievement array ── */
function updateRing(achieved){
  /* 4 quadrants: top-right, bottom-right, bottom-left, top-left
     mapped to card positions: c0=left1, c1=left2, c2=right1, c3=right2
     ring quadrant order (conic from top): c0(left1), c1(left2), c2(right1), c3(right2) */
  var stops=achieved.map(function(a){return a?'#16a34a':'#dc2626';});
  var conic='conic-gradient('+
    stops[0]+' 0% 25%,'+
    stops[1]+' 25% 50%,'+
    stops[2]+' 50% 75%,'+
    stops[3]+' 75% 100%)';
  $('av-outer').style.background=conic;
}

/* ── draw SVG connector lines ── */
function drawConnectors(achieved){
  var svg=$('svg-layer');
  svg.innerHTML='';
  var mainEl=$('main');
  var photo=$('photo-col');
  if(!mainEl||!photo) return;

  var mr=mainEl.getBoundingClientRect();
  var pr=photo.getBoundingClientRect();
  var px=(pr.left+pr.width/2)-mr.left;
  var py_top=pr.top-mr.top+4;
  var py_bot=pr.bottom-mr.top-4;

  var gcIds=['gc0','gc1','gc2','gc3'];
  var colors=achieved.map(function(a){return a?'#16a34a':'#dc2626';});

  /* centre dot at photo */
  function addDot(x,y,r,fill,opacity){
    var d=document.createElementNS('http://www.w3.org/2000/svg','circle');
    d.setAttribute('cx',x);d.setAttribute('cy',y);d.setAttribute('r',r);
    d.setAttribute('fill',fill);d.setAttribute('opacity',opacity||'1');
    svg.appendChild(d);
  }
  function addLine(d1,col){
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d1);p.setAttribute('fill','none');
    p.setAttribute('stroke',col);p.setAttribute('stroke-width','1.3');
    p.setAttribute('stroke-dasharray','4,3');p.setAttribute('opacity','0.55');
    svg.appendChild(p);
  }

  gcIds.forEach(function(id,i){
    var card=$(id);
    if(!card) return;
    var cr=card.getBoundingClientRect();
    var cx=(cr.left+cr.width/2)-mr.left;
    var cy=(cr.top+cr.height/2)-mr.top;
    var col=colors[i];

    var isLeft=i<2;
    var cardEdge=isLeft?(cr.right-mr.left):(cr.left-mr.left);
    var photoEdge=isLeft?(pr.left-mr.left):(pr.right-mr.left);
    var midX=(cardEdge+photoEdge)/2;

    /* elbow path: card edge → mid → photo edge at vertical midpoint of photo */
    var d='M'+cardEdge+','+cy+' H'+midX+' V'+py_top+' H'+px;
    addLine(d,col);
    addDot(cardEdge,cy,2.5,col,'0.8');
  });

  /* centre dot */
  addDot(px,py_top,4,'#16a34a','0.9');
}

/* ── responsive sizing ── */
function applyScale(){
  var w=window.innerWidth,h=window.innerHeight;
  var minDim=Math.min(w,h);

  /* avatar */
  var avSz=Math.min(90,Math.max(54,Math.round(w*0.1)));
  var outer=$('av-outer'),inner=$('av-inner');
  if(outer){outer.style.width=(avSz+8)+'px';outer.style.height=(avSz+8)+'px';}
  if(inner){inner.style.width=avSz+'px';inner.style.height=avSz+'px';}
  $('av-ini').style.fontSize=Math.round(avSz*0.32)+'px';

  /* card value font */
  var valFs=Math.min(18,Math.max(11,Math.round(w*0.022)));
  document.querySelectorAll('.gc-val').forEach(function(el){el.style.fontSize=valFs+'px';});

  /* card padding */
  var cp=Math.min(12,Math.max(7,Math.round(w*0.012)));
  document.querySelectorAll('.gc').forEach(function(el){
    el.style.padding=cp+'px '+(cp+1)+'px '+(cp-1)+'px';
  });

  /* name font */
  $('mgr-name').style.fontSize=Math.min(13,Math.max(9,Math.round(w*0.016)))+'px';

  setTimeout(function(){drawConnectors(window._achieved||[true,true,true,true]);},40);
}

if(window.ResizeObserver){
  new ResizeObserver(applyScale).observe(document.getElementById('main'));
}
window.addEventListener('resize',applyScale);

/* ── set KPI card ── */
function setCard(idx,label,actual,previous,budget){
  var p='gc'+idx;
  var isNPA=INVERT[idx];

  $(p+'-lbl').textContent=label||LABELS[idx];
  $(p+'-val').textContent=fmtN(actual);

  /* delta */
  var dEl=$(p+'-delta');
  var vsEl=$(p+'-vs');
  if(actual!==null&&previous!==null&&previous!==0){
    var delta=actual-previous;
    var pct=(delta/Math.abs(previous))*100;
    var up=isNPA?delta<=0:delta>=0;
    dEl.className='gc-delta '+(up?'up':'dn');
    dEl.textContent=(up?'▲ ':'▼ ')+(pct>=0?'+':'')+pct.toFixed(1)+'%';
    vsEl.textContent='vs previous period';
  } else {
    dEl.className='gc-delta neu'; dEl.textContent='—'; vsEl.textContent='';
  }

  /* attainment */
  var barEl=$(p+'-bar'), attEl=$(p+'-att');
  var achieved=false;
  if(actual!==null&&budget!==null&&budget!==0){
    var att=isNPA?(budget/actual)*100:(actual/budget)*100;
    var fillW=Math.min(100,Math.max(0,att));
    barEl.style.width=fillW+'%';
    achieved=att>=100;
    var gc=$(p);
    gc.className='gc '+(achieved?'ok':'miss');
    attEl.textContent=Math.round(att)+'% of target';
  } else {
    barEl.style.width='0%';
    attEl.textContent='';
    achieved=true; /* default green if no budget */
    $(p).className='gc ok';
  }
  return achieved;
}

/* ── initials + colour ── */
function ini(name){
  if(!name) return '?';
  var p=name.trim().split(/\s+/);
  return p.length===1?p[0].slice(0,2).toUpperCase():(p[0][0]+p[p.length-1][0]).toUpperCase();
}
var COLS=['#15803d','#1d4ed8','#854f0b','#7c3aed','#0e7490','#be185d'];
function nameCol(n){var s=0;for(var i=0;i<(n||'').length;i++)s+=n.charCodeAt(i);return COLS[s%COLS.length];}

/* ── data reader — confirmed working ── */
async function getData(ws){
  var rows=[],rdr=await ws.getSummaryDataReaderAsync(undefined,{ignoreSelection:true});
  for(var i=0;i<rdr.pageCount;i++){
    var pg=await rdr.getPageAsync(i);
    pg.data.forEach(function(r){
      var row={};
      pg.columns.forEach(function(c,idx){row[c.fieldName]=r[idx];});
      rows.push(row);
    });
  }
  await rdr.releaseAsync();
  return rows;
}

async function getEnc(ws){
  var spec=await ws.getVisualSpecificationAsync(),map={};
  if(spec.activeMarksSpecificationIndex<0) return map;
  spec.marksSpecifications[spec.activeMarksSpecificationIndex]
      .encodings.forEach(function(e){map[e.id]=e.field;});
  return map;
}

/* ── update Tableau parameter "selkpi" ── */
function updateParam(ws,categoryValue){
  try{
    ws.getParametersAsync().then(function(params){
      var p=params.find(function(x){return x.name==='selkpi';});
      if(p) p.changeValueAsync(categoryValue);
    });
  }catch(e){console.warn('param update failed:',e);}
}

/* ── render ── */
function render(data,enc,ws){
  if(!data.length) return;

  var row0=data[0];

  function dvStr(row,id){
    if(!enc[id]) return null;
    var d=row[enc[id].name];if(!d) return null;
    var f=d.formattedValue;
    return(f&&f!=='%null%'&&f!=='Null'&&f.trim()!=='')?f.trim():null;
  }
  function dvNum(row,id){
    if(!enc[id]) return null;
    var d=row[enc[id].name];if(!d) return null;
    var n=parseFloat(d.nativeValue!==undefined?d.nativeValue:d.value);
    return isNaN(n)?null:n;
  }

  /* ── manager name + image from Detail/Tooltip fields not in encodings ── */
  var usedKeys=[];
  Object.keys(enc).forEach(function(k){if(enc[k])usedKeys.push(enc[k].name);});
  var managerName=null,imageUrl=null;
  Object.keys(row0).forEach(function(k){
    if(usedKeys.indexOf(k)>=0) return;
    var dv=row0[k];if(!dv) return;
    var f=(dv.formattedValue||'').trim();
    if(!f||f==='%null%'||f==='Null') return;
    if(!imageUrl&&/^https?:\/\//i.test(f)) imageUrl=f;
    else if(!managerName&&!/^\d+$/.test(f)&&f.length>2&&f.length<60) managerName=f;
  });

  /* set photo */
  var img=$('av-img'),iniEl=$('av-ini');
  var initials=ini(managerName||'M');
  var col=nameCol(managerName||'');
  iniEl.textContent=initials; iniEl.style.color=col;

  if(imageUrl){
    img.onload=function(){img.style.display='block';iniEl.style.display='none';};
    img.onerror=function(){img.style.display='none';iniEl.style.display='flex';iniEl.style.background=col+'18';};
    img.style.display='block'; iniEl.style.display='none';
    img.src=imageUrl;
  } else {
    img.style.display='none'; iniEl.style.display='flex'; iniEl.style.background=col+'18';
  }
  $('mgr-name').textContent=managerName||'Manager';

  /* ── KPI cards ── */
  var cards=[null,null,null,null];
  data.forEach(function(row){
    var cat=dvStr(row,'category');
    if(!cat) return;
    var idx=CMAP[cat.toLowerCase().trim()];
    if(idx===undefined) return;
    cards[idx]={label:cat,actual:dvNum(row,'actual'),previous:dvNum(row,'previous'),budget:dvNum(row,'budget')};
  });

  var achieved=[true,true,true,true];
  cards.forEach(function(card,i){
    if(card) achieved[i]=setCard(i,card.label,card.actual,card.previous,card.budget);
    else setCard(i,LABELS[i],null,null,null);
  });

  window._achieved=achieved;
  updateRing(achieved);
  applyScale();
}

/* ── click on card → update parameter ── */
function wireCardClicks(ws){
  for(var i=0;i<4;i++){
    (function(idx){
      var el=$('gc'+idx);
      if(!el) return;
      el.addEventListener('click',function(){
        var lbl=el.querySelector('.gc-lbl');
        if(lbl) updateParam(ws,lbl.textContent);
        /* visual feedback */
        el.style.transform='scale(0.97)';
        setTimeout(function(){el.style.transform='';},150);
      });
    })(i);
  }
}

/* ── splash → main transition ── */
function showMain(){
  var splash=$('splash');
  splash.style.opacity='0';
  setTimeout(function(){
    splash.style.display='none';
    var main=$('main');
    main.style.display='flex';
    applyScale();
  },500);
}

/* ── confirmed working init pattern ── */
window.onload=tableau.extensions.initializeAsync().then(function(){
  var ws=tableau.extensions.worksheetContent.worksheet;
  wireCardClicks(ws);

  var dataReady=false, timerDone=false;

  setTimeout(function(){
    timerDone=true;
    if(dataReady) showMain();
  },2000);

  var update=async function(){
    var data=await getData(ws);
    var enc =await getEnc(ws);
    render(data,enc,ws);
    dataReady=true;
    if(timerDone) showMain();
  };

  ws.addEventListener(tableau.TableauEventType.SummaryDataChanged,function(){
    getData(ws).then(function(data){
      getEnc(ws).then(function(enc){render(data,enc,ws);});
    });
  });
  update();
});

})();
</script>
